name: Android APK release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel earlier pushes: every main push must get its own release.
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: android-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assign increasing Android version for this run
        run: |
          set -euo pipefail
          BASE_VERSION=$(sed -n 's/^versionName=//p' android/release.properties | tr -d '\r' | cut -d- -f1)
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="$BASE_VERSION-beta.$VERSION_CODE"
          printf 'ANDROID_VERSION_CODE=%s\nANDROID_VERSION_NAME=%s\nRELEASE_TAG=android-v%s\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$VERSION_NAME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test release gates
        run: node --test scripts/android-release.test.mjs
      - name: Build signed candidate and inspect hosted domain association
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/pamara-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          (cd android && bash gradlew assembleRelease lintRelease --no-daemon)
          node scripts/android-release.mjs --inspect-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-beta-candidate
          path: release-output/
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK, checksum and provenance as a beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="release-output/$ANDROID_VERSION_NAME"
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing-release.json"; then
            node --input-type=module -e '
              import fs from "node:fs";
              const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/existing-release.json", "utf8"));
              if (r.targetCommitish !== process.env.GITHUB_SHA) throw new Error("Tag belongs to another commit");
              if (!r.isDraft) process.stdout.write("Published release is immutable; keeping its existing assets.\n");
            '
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false ]; then
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --latest=false \
              --title "PaMaRa Bodega $ANDROID_VERSION_NAME" --notes-file "$OUT/RELEASE_NOTES.md"
          fi
          # Only a draft can reach this point. Publish after all assets upload successfully.
          gh release upload "$RELEASE_TAG" "$OUT"/*.apk "$OUT/SHA256SUMS.txt" "$OUT/release-manifest.json" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
