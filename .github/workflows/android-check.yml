name: Android checks

on:
  pull_request:
    paths: ['android/**', 'scripts/android-*', 'public/.well-known/**', '.github/workflows/android-*']
  push:
    branches: [main]
    paths: ['android/**', 'scripts/android-*', 'public/.well-known/**', '.github/workflows/android-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test release gates
        run: node --test scripts/android-release.test.mjs
      - name: Compile and lint Android without release secrets
        working-directory: android
        run: bash gradlew assembleDebug lintDebug --no-daemon
