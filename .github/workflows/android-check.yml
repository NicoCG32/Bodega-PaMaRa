name: Android checks

on:
  pull_request:
    paths: ['android/**', 'scripts/android-*', 'public/.well-known/**', '.github/workflows/android-*']
  push:
    branches: [main]
    paths: ['android/**', 'scripts/android-*', 'public/.well-known/**', '.github/workflows/android-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$sdk_manager"
          "$sdk_manager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test release gates
        run: node --test scripts/android-release.test.mjs
      - name: Compile and lint Android without release secrets
        working-directory: android
        run: bash gradlew assembleDebug lintDebug --no-daemon
