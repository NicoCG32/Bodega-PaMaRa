name: Calidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-once:
    # Trabajo temporal y acotado al PR del titular, sin tocar main.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/estado-visible-2026'
    name: Formatear código heredado (una sola vez)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Instalar dependencias fijadas
        run: bun install --frozen-lockfile
      - name: Aplicar formato oficial sin cambiar semántica
        run: bunx prettier --write "**/*.{js,jsx,ts,tsx,mjs,cjs}"
      - name: Guardar los cambios de formato en este PR
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No hay diferencias de formato"
            exit 0
          fi
          git diff --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: aplicar Prettier al código existente sin cambios funcionales"
          git push origin "HEAD:refs/heads/$PR_BRANCH"

  quality:
    name: Lint, tipos y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Instalar dependencias fijadas
        run: bun install --frozen-lockfile
      - name: Verificar formato y análisis estático
        run: bun run lint
      - name: Verificar tipos
        run: bunx tsc --noEmit
      - name: Verificar distribución
        run: node --test scripts/android-release.test.mjs
      - name: Ejecutar pruebas
        run: bun run test
      - name: Compilar aplicación
        run: bun run build
